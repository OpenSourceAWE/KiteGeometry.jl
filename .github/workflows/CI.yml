name: CI
on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  reuse-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run REUSE lint
        run: |
          docker run --rm --volume ${{ github.workspace }}:/data fsfe/reuse lint
  generated-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail where the vendored files differ from the recorded awesIO commit
        run: |
          repository=$(sed -n 's/^repository = "\(.*\)"$/\1/p' gen/awesio.toml)
          commit=$(sed -n 's/^commit = "\(.*\)"$/\1/p' gen/awesio.toml)
          upstream="https://raw.githubusercontent.com/$repository/$commit"
          curl -fsSL "$upstream/src/awesio/schemas/structure_schema.yml" |
            cmp - src/awesio/structure_schema.yml
          curl -fsSL "$upstream/examples/structure/v3_beam_structure.yml" |
            cmp - test/data/v3_beam_structure.yml
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - name: Regenerate the component types from the vendored schema
        run: julia --project src/build.jl
      - name: Fail where the committed types differ from the schema
        run: git diff --exit-code src/_structure.jl
