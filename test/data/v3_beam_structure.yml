metadata:
  name: v3_kite_beam
  description: "Resolved structure of the TU Delft V3 kite as V3Kite.jl's Timoshenko-beam project builds it: the same bridle and tether on a leading-edge tube and struts of rigid bodies joined by tubes, under a massless frame carrying the canopy."
  note: "The V3 kite of OpenSourceAWE/V3Kite.jl@973a818a `data/system_beam.yaml`, placed at 70° elevation, 0° azimuth and 0° heading. `v3_canopy` is the 170 g/m^2 fabric of awegroup/TUDELFT_V3_KITE@6d620ba, which the wing's extra_mass still holds."
  awesIO_version: 1.0.0
  schema: "structure_schema.yml"
  n_points: 220
  connectivity_sha: 5ce4dd3c33669a04b3a4bf192ad2c6675907081324e30e56c7110ebc7a1ee639

